<!DOCTYPE html>
<html id="root_elm">
    <head>
        <meta name="encoding" charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preload" href="script.js" as="script">
        <link rel="stylesheet" href="../style.css">
        <link rel="stylesheet" href="style.css">
        <title>Chord</title>
    </head>
    <body>
        <div id="chord_div">
            <div>
                <div class="inputs">
                    <label for="octave_in">Octave</label><input id="octave_in" name="octave_in" type="number" value="3">
                    <label for="type_in">Chord type</label><select id="type_in" name="type_in">
                        <option value="maj">Major</option>
                        <option value="min">Minor</option>
                        <option value="dim">Diminished</option>
                        <option value="aug">Augmented</option>
                        <option value="sus4">Suspended 4</option>
                        <option value="sus2">Suspended 2</option>
                        <option value="5th">Fifth</option>
                        <option value="maj7">Major 7th</option>
                        <option value="min7">Minor 7th</option>
                        <option value="raw">1 note only</option>
                        <option value="maj_scale" id="type_maj_scale" disabled>Major scale</option>
                        <option value="min_scale" id="type_min_scale" disabled>Minor scale</option>
                    </select>
                </div>
                <div id="pitch_div"></div>
            </div>
            <hr/>
            <div>
                <div class="inputs">
                    <label for="relative_en">Roman numerals</label><input id="relative_en" name="relative_en" type="checkbox">
                </div>
                <div id="relative_sel"></div>
            </div>
        </div>
        <div id="output_div">
            <span>Chord composition <span id="chord_composition"></span></span>
        </div>
        <div id="control_div" class="inputs">
            <label for="volume_in">Volume</label><input id="volume_in" name="volume_in" type="range" min="0" max="1" step="0.01" value="0.15">
        </div>
        <script src="script.js"></script>
    </body>
</html>
