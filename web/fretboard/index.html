<!DOCTYPE html>
<html id="root_elm">
    <head>
        <meta name="encoding" charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preload" href="script.js" as="script">
        <link rel="stylesheet" href="../style.css">
        <link rel="stylesheet" href="style.css">
        <title>Fretboard map</title>
    </head>
    <body>
        <div id="wrapper">
            <div id="fretboard"></div>
        </div>
        <button class="filled fab" command="show-modal" commandfor="settings"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
        <dialog id="settings">
            <h1>Settings</h1>
            <div class="inputs">
                <label for="volume_in">Volume</label><input id="volume_in" name="volume_in" type="range" min="0" max="1" step="0.01" value="0.15">
                <label for="frets_count_in">Number of frets</label><input id="frets_count_in" name="frets_count_in" type="number" value="12">
                <label for="same_octave_in">Same octave only</label><input id="same_octave_in" name="same_octave_in" type="checkbox">
                <label for="fret_label_num_in">Use fret numbers</label><input id="fret_label_num_in" name="fret_label_num_in" type="checkbox">
                <label for="notation_in">Note notation</label><select id="notation_in" name="notation_in">
                    <option value="A,B♭,B,C,D♭,D,E♭,E,F,G♭,G,A♭" selected>Flats (unicode)</option>
                    <option value="A,Bb,B,C,Db,D,Eb,E,F,Gb,G,Ab">Flats (ASCII)</option>
                    <option value="A,A♯,B,C,C♯,D,D♯,E,F,F♯,G,G♯">Sharps (unicode)</option>
                    <option value="A,A#,B,C,C#,D,D#,E,F,F#,G,G#">Sharps (ASCII)</option>
                </select>
                <label for="tuning_in">Tuning</label><select id="tuning_in" name="tuning_in">
                    <optgroup label="Guitar (6 strings)">
                        <option value="-5,-10,-14,-19,-24,-29" selected>Standard tuning</option>
                        <option value="-6,-11,-15,-20,-25,-30">Half-step down tuning</option>
                        <option value="-10,-15,-19,-24,-29,-36">Drop A tuning</option>
                        <option value="-8,-13,-17,-22,-27,-34">Drop B tuning</option>
                        <option value="-7,-12,-16,-21,-26,-33">Drop C tuning</option>
                        <option value="-5,-10,-14,-19,-24,-31">Drop D tuning</option>
                        <option value="-5,-9,-14,-21,-26,-33">Open C tuning</option>
                        <option value="-7,-12,-15,-19,-24,-31">Open D tuning</option>
                        <option value="-5,-10,-13,-17,-22,-29">Open E tuning</option>
                        <option value="-7,-10,-14,-19,-26,-31">Open G tuning</option>
                    </optgroup>
                    <optgroup label="Bass (4 strings)">
                        <option value="-26,-31,-36,-41">Standard tuning</option>
                    </optgroup>
                </select>
            </div>
            <div class="actions">
                <button id="settings_close" command="close" commandfor="settings">Done</button>
            </div>
        </dialog>
        <script src="script.js"></script>
    </body>
</html>
